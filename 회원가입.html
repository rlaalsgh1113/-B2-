<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 가입 - 대리점 비교 시스템</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .signup-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #1c1e21; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .input-half { width: 48%; }
        .btn-signup { width: 100%; padding: 12px; background-color: #000; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="signup-box">
        <h1>회원 가입</h1>
        <form>
            <input type="text" placeholder="이름">
            <input type="email" placeholder="이메일">
            
            <div class="input-group">
                <input type="text" class="input-half" placeholder="아이디">
                <input type="password" class="input-half" placeholder="비밀번호">
            </div>

            <div class="input-group">
                <input type="text" class="input-half" placeholder="코드">
                <input type="text" class="input-half" placeholder="전화번호">
            </div>

            <button type="button" class="btn-signup" onclick="location.href='로그인.html'">회원가입</button>
        </form>
    </div>
</body>
</html>
