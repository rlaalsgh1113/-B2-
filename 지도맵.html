<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>내 주변 대리점</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root {
            --google-blue: #4285F4;
            --white: #ffffff;
            --text-main: #191F28;
            --text-grey: #8B95A1;
            --border: #E5E8EB;
        }
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding-bottom: 75px; background: #f2f4f6; overflow: hidden; }
        #map { width: 100vw; height: 100vh; z-index: 1; }
        .top-section { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .header { padding: 12px 16px 4px 16px; font-weight: 800; font-size: 16px; }
        .filter-grid { padding: 8px 16px 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .dropdown-btn { width: 100%; background: #fff; border: 1px solid var(--border); padding: 8px 10px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-main); }
        .info-card { position: fixed; bottom: 85px; left: 12px; right: 12px; background: white; border-radius: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 16px; display: none; z-index: 1100; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .shop-name { font-size: 16px; font-weight: 800; margin: 0; }
        .shop-address { font-size: 11px; color: var(--text-grey); margin-top: 2px; font-weight: 500; }
        .route-stats { display: flex; gap: 10px; font-size: 12px; font-weight: 700; color: var(--google-blue); padding-top: 4px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-msg { background: var(--google-blue); color: white; }
        .btn-call { background: #f2f4f6; color: var(--text-main); }
        .home-marker { width: 12px; height: 12px; background: var(--google-blue); border: 2px solid white; border-radius: 50%; box-shadow: 0 0 8px rgba(66,133,244,0.6); }
        .shop-marker { width: 30px; height: 30px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); border: 1px solid #eee; }
        .bottom-nav { display: flex; background: white; height: 75px; position: fixed; bottom: 0; width: 100%; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #70757a; text-decoration: none; font-size: 11px; }
        .nav-item.active { color: var(--google-blue); font-weight: 800; }
    </style>
</head>
<body>

    <div class="top-section">
        <div class="header">내 주변 대리점</div>
        <div class="filter-grid">
            <button class="dropdown-btn">제조사 (전체) <span>▼</span></button>
            <button class="dropdown-btn">모델명 (전체) <span>▼</span></button>
            <button class="dropdown-btn">내 통신사: SKT <span>▼</span></button>
            <button class="dropdown-btn">변경: LG <span>▼</span></button>
        </div>
    </div>

    <div id="map"></div>

    <div class="info-card" id="infoCard">
        <div class="card-top">
            <div>
                <h3 class="shop-name" id="shopTitle">대리점 명칭</h3>
                <div class="shop-address" id="shopAddress">주소 정보</div>
            </div>
            <div class="route-stats">
                <span id="walkTime">🚶 0분</span>
                <span id="driveTime">🚗 0분</span>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-msg" onclick="alert('1:1 메시지 상담을 시작합니다.')">1:1 메시지 보내기</button>
            <button class="btn btn-call" onclick="alert('전화 상담으로 연결합니다.')">전화 상담</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="리스트.html" class="nav-item">📊<div>비교</div></a>
        <a href="지도맵.html" class="nav-item active">🗺️<div>지도</div></a>
        <a href="커뮤니티.html" class="nav-item">💬<div>톡</div></a>
        <a href="프로필.html" class="nav-item">👤<div>MY</div></a>
    </div>

    <script>
        const homeCoords = [35.9125, 128.8077];
        const stores = [
            { name: "대가대 스마트폰 성지", address: "경산시 하양읍 금락리 123-1", lat: 35.9142, lng: 128.8122, walk: "6분", drive: "1분" },
            { name: "옆커폰 하양점", address: "경산시 하양읍 하양로 45", lat: 35.9125, lng: 128.8135, walk: "8분", drive: "2분" },
            { name: "하양 휴대폰 백화점", address: "경산시 하양읍 조산천동길 12", lat: 35.9110, lng: 128.8150, walk: "11분", drive: "3분" },
            { name: "엔젤통신 하양점", address: "경산시 하양읍 하양상가길 7", lat: 35.9135, lng: 128.8170, walk: "13분", drive: "3분" },
            { name: "KT 하양직영점", address: "경산시 하양읍 금락리 99-4", lat: 35.9100, lng: 128.8110, walk: "9분", drive: "2분" },
            { name: "SKT 하양중앙점", address: "경산시 하양읍 하양로 30", lat: 35.9085, lng: 128.8145, walk: "14분", drive: "4분" },
            { name: "LG U+ 하양점", address: "경산시 하양읍 하양로 55", lat: 35.9120, lng: 128.8185, walk: "16분", drive: "5분" },
            { name: "하양 폰마켓", address: "경산시 하양읍 금락리 200-5", lat: 35.9155, lng: 128.8100, walk: "7분", drive: "2분" },
            { name: "성지 모바일 2호점", address: "경산시 하양읍 대가대로 11", lat: 35.9090, lng: 128.8080, walk: "12분", drive: "3분" },
            { name: "대가대 폰샵", address: "경산시 하양읍 금락리 150-2", lat: 35.9150, lng: 128.8140, walk: "5분", drive: "1분" }
        ];

        const map = L.map('map', { zoomControl: false }).setView(homeCoords, 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const homeIcon = L.divIcon({ className: 'home-marker', iconSize: [12, 12], iconAnchor: [6, 6] });
        L.marker(homeCoords, { icon: homeIcon }).addTo(map);

        const shopIcon = L.divIcon({ className: 'shop-marker', html: '📱', iconSize: [30, 30], iconAnchor: [15, 15] });
        let currentRoute = null;

        async function getOSMRoute(start, end) {
            const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
            } catch (e) {
                return [start, end];
            }
        }

        stores.forEach(s => {
            const marker = L.marker([s.lat, s.lng], { icon: shopIcon }).addTo(map);
            marker.on('click', async (e) => {
                if (currentRoute) map.removeLayer(currentRoute);
                
                const routePoints = await getOSMRoute(homeCoords, [s.lat, s.lng]);
                
                currentRoute = L.polyline(routePoints, {
                    color: '#4285F4', weight: 5, opacity: 0.8, lineCap: 'round'
                }).addTo(map);

                document.getElementById('shopTitle').innerText = s.name;
                document.getElementById('shopAddress').innerText = s.address;
                document.getElementById('walkTime').innerText = `🚶 ${s.walk}`;
                document.getElementById('driveTime').innerText = `🚗 ${s.drive}`;
                document.getElementById('infoCard').style.display = 'block';
                
                map.fitBounds(currentRoute.getBounds(), { padding: [100, 100] });
            });
        });

        map.on('click', () => {
            document.getElementById('infoCard').style.display = 'none';
            if (currentRoute) { map.removeLayer(currentRoute); currentRoute = null; }
        });
    </script>
</body>
</html>
